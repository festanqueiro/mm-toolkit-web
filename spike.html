<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>MM Toolkit — Phase 0 spike</title>
  </head>
  <body>
    <main class="spike">
      <h1>Phase 0 spike: promo render benchmark</h1>
      <p class="muted">
        Renders an MP4 entirely in this browser: audio + image → WebGL bass-reactive blur → WebCodecs → MP4.
        Nothing is uploaded. Use “Generated test media” for a comparable run across devices.
      </p>
      <form id="form">
        <fieldset>
          <legend>Input</legend>
          <label>Audio <input id="audio" type="file" accept="audio/*,.wav,.aif,.aiff,.flac,.mp3,.m4a,.aac,.ogg" /></label>
          <label>Image <input id="image" type="file" accept="image/*" /></label>
          <label><input id="generated" type="checkbox" checked /> Generated test media (100 s 44.1 kHz stereo WAV + 1500×1500 PNG)</label>
        </fieldset>
        <fieldset>
          <legend>Output</legend>
          <label>Profile
            <select id="profile">
              <option value="1080x1920" selected>Vertical 1080 × 1920</option>
              <option value="1080x1080">Square 1080 × 1080</option>
              <option value="1920x1080">Landscape 1920 × 1080</option>
            </select>
          </label>
          <label>Frame rate <input id="fps" type="number" min="12" max="60" value="24" /></label>
          <label>Start (s) <input id="start" type="number" min="0" step="0.5" value="40" /></label>
          <label>Duration (s) <input id="duration" type="number" min="1" max="600" value="60" /></label>
          <label>Quality
            <select id="bpp">
              <option value="0.20">Maximum (0.20 bpp)</option>
              <option value="0.12" selected>High (0.12 bpp)</option>
              <option value="0.07">Standard (0.07 bpp)</option>
              <option value="0.04">Small (0.04 bpp)</option>
            </select>
          </label>
          <label>Audio bitrate
            <select id="audioBitrate">
              <option value="128000">128k</option>
              <option value="192000">192k</option>
              <option value="256000">256k</option>
              <option value="320000" selected>320k</option>
            </select>
          </label>
          <label><input id="bassBlur" type="checkbox" checked /> Bass-reactive blur</label>
        </fieldset>
        <button id="run" type="submit">Render</button>
      </form>
      <progress id="progress" max="100" value="0" hidden></progress>
      <p id="status" role="status"></p>
      <pre id="result" data-testid="result" hidden></pre>
      <p><a id="download" hidden download="spike-promo.mp4">Download MP4</a></p>
      <video id="video" controls hidden playsinline></video>
    </main>
    <script type="module" src="/src/spike/main.ts"></script>
  </body>
</html>
